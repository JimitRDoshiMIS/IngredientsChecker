[server]
# Listen on all interfaces so a phone on the same Wi-Fi can open the app.
address = "0.0.0.0"
port = 8501
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#ff4b4b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#111827"
